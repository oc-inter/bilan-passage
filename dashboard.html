<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard OC Inter">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest-dashboard.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dashboard international — Optical Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* Charte internationale (lot 1) : écrans sur fond noir, rouge #E2231A,
     rose #FCEBEA. Propriétés logiques (inline/block) pour préparer l'hébreu. */
  :root {
    --bg: #0D0D0D;
    --surface: #161615;
    --surface-2: #1E1E1C;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --text: #F5F5F5;
    --red: #E2231A;
    --pink: #FCEBEA;
    --green: #3FB950;
    --green-bg: rgba(63,185,80,0.14);
    --orange: #F0A23B;
    --orange-bg: rgba(240,162,59,0.14);
    --red-bg: rgba(226,35,26,0.16);
    --gray: #9A9993;
    --gray-2: #6B6A65;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Heebo', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  html[lang="he"] body { font-family: 'Heebo', 'Montserrat', -apple-system, sans-serif; }
  select, input, textarea, button { font-family: inherit; }
  header.topbar {
    background: var(--bg);
    border-block-end: 1px solid var(--line);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header.topbar h1 { font-size: 17px; font-weight: 700; margin: 0; }
  header.topbar h1 span { color: var(--red); }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  header.topbar button, .lang-select {
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .lang-select option { background: var(--surface); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .scope-label { color: var(--gray); font-size: 13px; margin: -8px 0 14px; }

  /* ---- Connexion ---- */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px; width: 340px; max-width: 100%; }
  .login-card h2 { margin: 0 0 4px; font-size: 20px; }
  .login-card h2 span { color: var(--red); }
  .login-card p.sub { color: var(--gray); font-size: 13px; margin: 0 0 20px; }
  .login-card label { display: block; font-size: 13px; margin: 14px 0 5px; font-weight: 500; }
  .login-card input, .login-card select {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line-2); border-radius: 6px;
    font-size: 14px; background: var(--bg); color: var(--text);
  }
  .login-card button.submit {
    width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px;
    background: var(--red); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-card button.submit:disabled { opacity: .5; cursor: not-allowed; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }
  .login-lang { margin-top: 16px; text-align: center; }

  /* ---- Filtres ---- */
  .filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filters select, .filters input {
    padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 13px;
    background: var(--surface); color: var(--text);
  }
  .filters input { flex: 1; min-width: 180px; }
  .btn-dark { background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-dark:hover { border-color: var(--red); }

  /* ---- Vignettes ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi-card .lbl { font-size: 12px; color: var(--gray); margin: 0 0 4px; }
  .kpi-card .val { font-size: 22px; font-weight: 700; margin: 0; }
  .kpi-card.kpi-click { cursor: pointer; transition: border-color .15s, transform .15s; }
  .kpi-card.kpi-click:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .kpi-card.kpi-click:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---- Tableaux ---- */
  table.dash-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; }
  table.dash-table th { text-align: start; font-size: 12px; color: var(--gray); font-weight: 600; padding: 10px 12px; border-block-end: 1px solid var(--line-2); }
  table.dash-table td { padding: 10px 12px; font-size: 13px; border-block-end: 1px solid var(--line); }
  table.dash-table tr.row-clickable { cursor: pointer; }
  table.dash-table tr.row-clickable:hover td { background: var(--surface-2); }
  table.dash-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.dash-table th.sortable:hover { color: var(--text); }
  table.dash-table th.sorted { color: var(--red); }
  table.dash-table th .sort-ind { font-size: 10px; margin-inline-start: 3px; }
  .muted { color: var(--gray); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-vert { background: var(--green-bg); color: var(--green); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-rouge { background: var(--red-bg); color: var(--red); }
  .badge-neutre { background: rgba(255,255,255,0.08); color: var(--gray); }

  /* ---- Fiche ---- */
  .back-btn { background: none; border: none; color: var(--red); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; margin-block-end: 14px; }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .detail-header h2 { margin: 0 0 2px; font-size: 21px; }
  .detail-header .sub { color: var(--gray); font-size: 13px; }
  .pos-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 20px; }
  .pos-chip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .pos-chip .v { font-weight: 700; font-size: 16px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); margin: 22px 0 8px; }
  .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; }
  .sub-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; color: var(--text); }
  .sub-card:hover { border-color: var(--line-2); }
  .sub-card .lbl { font-size: 11px; color: var(--gray); margin: 0 0 4px; }
  .sub-card .val { font-size: 17px; font-weight: 700; margin: 0; }
  .sub-card .poids { font-size: 10px; color: var(--gray-2); margin: 3px 0 0; }
  .chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 6px; height: 200px; position: relative; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; }
  .item-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-block-end: 1px solid var(--line); }
  .item-row:last-child { border-block-end: none; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mini-table th { font-weight: 700; padding: 4px 0; text-align: start; }
  .mini-table td { padding: 5px 0; border-block-end: 1px solid var(--line); }
  .mini-table .num { text-align: end; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 18px; width: 420px; max-width: 100%; color: var(--text); }
  .modal-box h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-close { float: inline-end; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray); }
  .kl-box { width: 520px; max-height: 85vh; overflow-y: auto; }
  .kl-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 4px; border-block-end: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .kl-row:hover { background: var(--surface-2); }
  .kl-row:last-child { border-block-end: none; }
  .kl-ar { display: block; font-size: 11px; color: var(--gray); }
  .kl-row > span:first-child { flex: 1 1 auto; min-width: 0; }
  .kl-info { font-size: 12px; color: var(--gray); text-align: end; flex: 0 1 55%; }
  .kl-vide { font-size: 13px; color: var(--gray); padding: 6px 4px; }
  .kl-compte { font-size: 13px; color: var(--gray); margin: -6px 0 8px; }
  .kl-autres { margin-top: 14px; }
  .kl-autres summary { cursor: pointer; list-style: none; display: flex; justify-content: center; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
  .kl-autres summary::-webkit-details-marker { display: none; }
  .kl-autres summary::after { content: '▾'; font-size: 12px; }
  .kl-autres[open] summary::after { content: '▴'; }
  .kl-tag-retard { color: var(--orange); font-weight: 600; }
  .kl-tag-ko { color: var(--red); font-weight: 600; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .loading { text-align: center; padding: 40px; color: var(--gray); }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 8px; }
  .section-head .section-label { margin: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .card-head h4 { margin: 0; }
  .app-links { display: flex; gap: 14px; flex-wrap: wrap; }
  a.app-link { font-size: 12px; font-weight: 600; color: var(--red); text-decoration: none; white-space: nowrap; }
  a.app-link:hover { text-decoration: underline; }
  .apps-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
  .apps-bar a { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--text); text-decoration: none; }
  .apps-bar a:hover { border-color: var(--red); color: var(--red); }

  .sv-summary { font-size: 13px; margin: 0 0 8px; }
  .sv-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; font-size: 13px; padding: 8px 0; border-block-end: 1px solid var(--line); }
  .sv-row:last-child { border-block-end: none; }
  .sv-lib { font-weight: 600; }
  .sv-meta { display: block; font-size: 12px; color: var(--gray); font-weight: 400; margin-top: 2px; }
  .sv-ech { white-space: nowrap; text-align: end; font-size: 12px; }
  .sv-ech b { display: block; font-size: 13px; }
  .sv-retard { color: var(--red); }
  .sv-bientot { color: var(--orange); }
  .sv-later { color: var(--gray); }
  details.sv-clos { margin-top: 10px; font-size: 13px; }
  details.sv-clos summary { cursor: pointer; color: var(--gray); font-size: 12px; }
  .sv-sub { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--gray); margin: 0 0 6px; }

  /* ---- Onglets + « Aujourd'hui » ---- */
  .main-tabs { display: flex; gap: 4px; margin: 0 0 18px; border-block-end: 1px solid var(--line-2); overflow-x: auto; }
  .main-tabs button { background: none; border: none; border-block-end: 3px solid transparent; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer; margin-bottom: -1px; white-space: nowrap; }
  .main-tabs button.active { color: var(--text); border-block-end-color: var(--red); }
  .today-status { font-size: 13px; color: var(--gray); margin: -6px 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: livepulse 2s infinite; }
  @keyframes livepulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .link-btn { background: none; border: none; color: var(--red); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0; }
  .kpi-sub { font-size: 14px; font-weight: 500; color: var(--gray); }
  table.today-table th.c, table.today-table td.c { text-align: center; padding-inline: 6px; white-space: nowrap; }
  table.today-table td.c { min-width: 62px; }
  .t-mag { font-weight: 600; display: block; }
  .t-ar { display: block; font-size: 11px; color: var(--gray); margin-top: 2px; }
  .t-ok { color: var(--green); font-weight: 800; font-size: 16px; display: block; line-height: 1.1; }
  .t-ko { color: var(--red); font-weight: 800; font-size: 15px; display: block; line-height: 1.1; }
  .t-h { display: block; font-size: 11px; color: var(--gray); margin-top: 1px; }
  .t-ko-txt { color: var(--red); }
  .t-retard { color: var(--orange); font-weight: 800; font-size: 16px; display: block; line-height: 1.1; }
  .t-retard-txt { color: var(--orange); }
  .kpi-note { font-size: 11px; color: var(--orange); font-weight: 600; margin: 2px 0 0; }
  .t-gris { font-size: 12px; color: var(--gray-2); }
  tr.t-inactif .t-mag { color: var(--gray); }
  .feed-row { display: flex; gap: 12px; font-size: 13px; padding: 7px 0; border-block-end: 1px solid var(--line); }
  .feed-row:last-child { border-block-end: none; }
  .feed-h { font-weight: 700; min-width: 42px; }
  .feed-par { color: var(--gray); }
  .today-kpis { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); }
  table.today-table th:first-child, table.today-table td:first-child { position: sticky; inset-inline-start: 0; background: var(--surface); z-index: 1; min-width: 150px; }
  .sticky-wrap { max-height: calc(100vh - 150px); overflow: auto; border-radius: 10px; border: 1px solid var(--line); }
  .sticky-wrap table.dash-table { border-radius: 0; overflow: visible; }
  .sticky-wrap table.dash-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; box-shadow: inset 0 -1px 0 var(--line-2); }
  .sticky-wrap table.dash-table thead th:first-child { inset-inline-start: 0; z-index: 3; }

  /* ---- Score mensuel ---- */
  .sm-banner { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 0 0 12px; }
  .sm-banner b { font-size: 14px; }
  .sm-b-apercu { background: rgba(255,255,255,0.07); }
  .sm-b-prov { background: var(--orange-bg); color: var(--orange); }
  .sm-b-valide { background: var(--green-bg); color: var(--green); }
  .sm-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .sm-btn { background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); }
  .sm-btn:hover { border-color: var(--text); }
  .sm-btn-red { background: var(--red); border-color: var(--red); color: #fff; }
  .sm-btn-red:hover { background: #b51a12; border-color: #b51a12; }
  .sm-btn-sm { padding: 4px 10px; font-size: 12px; }
  .sm-btn-danger { color: var(--red); border-color: rgba(226,35,26,0.4); }
  .sm-props { margin: 0 0 14px; }
  .sm-prop-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; padding: 8px 0; border-block-end: 1px solid var(--line); }
  .sm-prop-row:last-child { border-block-end: none; }
  .sm-prop-btns { display: flex; gap: 6px 14px; flex-shrink: 0; }
  .sm-v { font-weight: 700; font-size: 13px; }
  .sm-ok { color: var(--green); } .sm-moy { color: var(--orange); } .sm-bas { color: var(--red); }
  .sm-n { display: inline-block; background: rgba(255,255,255,0.1); color: var(--gray); font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .sm-up { color: var(--green); font-weight: 700; font-size: 12px; } .sm-down { color: var(--red); font-weight: 700; font-size: 12px; }
  .sm-legende { font-size: 12px; color: var(--gray); margin: 10px 2px 0; line-height: 1.6; }
  .sm-modal-box { width: 560px; max-height: 88vh; overflow-y: auto; }
  .sm-dim-row { display: grid; grid-template-columns: 1fr 44px; gap: 2px 10px; padding: 8px 0; border-block-end: 1px solid var(--line); font-size: 13px; }
  .sm-dim-row label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sm-dim-v { text-align: end; font-weight: 700; }
  .sm-dim-etat { grid-column: 1 / -1; padding-inline-start: 19px; }
  .sm-dim-etat .sv-meta { display: inline; }
  .sm-neutra-form { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .sm-neutra-form input[type=text], .sm-neutra-form select { padding: 9px 10px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 13px; background: var(--bg); color: var(--text); }
  .sm-entier { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .sm-modal-box a { color: var(--red); }
  .advice-btn { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .advice-btn:disabled { opacity: .6; }
  .advice-content { margin-top: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

  @media (max-width: 480px) {
    main { padding: 14px 10px 50px; }
    header.topbar { padding: 12px 14px; }
    header.topbar h1 { font-size: 15px; }
    .detail-header h2 { font-size: 18px; }
    .card, .kpi-card { padding: 12px; }
    .main-tabs button { padding: 10px 10px; font-size: 13px; }
    .today-kpis { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .today-kpis .kpi-card { padding: 8px; }
    .today-kpis .kpi-card .lbl { font-size: 10px; }
    .today-kpis .kpi-card .val { font-size: 17px; }
    table.today-table td:first-child, table.today-table th:first-child { min-width: 120px; max-width: 140px; }
  }
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>Dashboard <span id="login-title-inter">international</span></h2>
    <p class="sub" data-i18n="login_sub">Connexion avec ton identifiant Zimbra</p>
    <label for="login-user" data-i18n="login_user">Identifiant</label>
    <input type="text" id="login-user" placeholder="prenom.nom@optical-center.com" autocomplete="username">
    <label for="login-pass" data-i18n="login_pass">Mot de passe</label>
    <input type="password" id="login-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="submit" id="login-btn" onclick="doLogin()" data-i18n="login_btn">Se connecter</button>
    <p class="login-error" id="login-error"></p>
    <div class="login-lang"><select class="lang-select" id="login-lang" onchange="setLang(this.value)"></select></div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <header class="topbar">
    <h1>Dashboard <span id="topbar-inter">international</span></h1>
    <div class="topbar-actions">
      <select class="lang-select" id="topbar-lang" onchange="setLang(this.value)"></select>
      <button onclick="logout()" data-i18n="logout">Déconnexion</button>
    </div>
  </header>
  <main>
    <p class="scope-label" id="scope-label"></p>
    <nav class="main-tabs" id="main-tabs">
      <button data-tab="network" class="active" onclick="showNetworkView()" data-i18n="tab_network">Santé réseau</button>
      <button data-tab="today" onclick="showTodayView()" data-i18n="tab_today">Aujourd'hui</button>
      <button data-tab="mensuel" onclick="showMonthlyView()" data-i18n="tab_monthly">Score mensuel</button>
    </nav>
    <div id="view-network"></div>
    <div id="view-today" style="display:none"></div>
    <div id="view-mensuel" style="display:none"></div>

function escDash(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escJs(x) { return String(x == null ? '' : x).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

// ---------------------------------------------------------------- Langue
const LANGS = ['fr', 'en', 'es', 'nl'];
const LANG_NOMS = { fr: 'Français', en: 'English', es: 'Español', nl: 'Nederlands' };
const LOCALES = { fr: 'fr-FR', en: 'en-GB', es: 'es-ES', nl: 'nl-NL', he: 'he-IL' };
let LANG = 'fr';
function t(k, vars) {
  let s = (I18N[LANG] && I18N[LANG][k] != null) ? I18N[LANG][k] : (I18N.fr[k] != null ? I18N.fr[k] : k);
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, n) => vars[n] != null ? vars[n] : '');
  return s;
}
// Pluriel simple : clé + '_p' au-delà de 1.
function tn(k, n, vars) { return t(Math.abs(n) > 1 ? k + '_p' : k, Object.assign({ n }, vars || {})); }
function SEP() { return LANG === 'fr' ? ' : ' : ': '; }
function auteurLabel(a) { return a === 'Accès réseau complet' ? t('acces_complet') : a === 'Calcul automatique (1er du mois)' ? t('calcul_auto') : a === 'Système' ? t('systeme') : (a || ''); }
function loc() { return LOCALES[LANG] || 'fr-FR'; }
function initLang() {
  let l = null;
  try { l = localStorage.getItem(K_LANG); } catch (e) {}
  if (!l) l = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(l) ? l : 'fr';
  appliquerLang();
}
function appliquerLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
  document.title = t('page_title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('login-title-inter').textContent = t('international');
  document.getElementById('topbar-inter').textContent = t('international');
  const opts = LANGS.map(l => '<option value="' + l + '"' + (l === LANG ? ' selected' : '') + '>' + LANG_NOMS[l] + '</option>').join('');
  document.getElementById('login-lang').innerHTML = opts;
  document.getElementById('topbar-lang').innerHTML = opts;
}
function setLang(l) {
  LANG = LANGS.includes(l) ? l : 'fr';
  try { localStorage.setItem(K_LANG, LANG); } catch (e) {}
  appliquerLang();
  if (session) { majScopeLabel(); rerenderVueCourante(); }
}

function svDateFr(iso) { if (!iso) return '—'; const d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z'); return isNaN(d) ? '—' : d.toLocaleDateString(loc(), { timeZone: 'UTC' }); }
function svJours(fromIso, toIso) { return Math.round((Date.parse(toIso + 'T00:00:00Z') - Date.parse(fromIso + 'T00:00:00Z')) / 86400000); }

// Section « Suivi manager » : actions / objectifs datés posés en entretien.
function renderSuiviManagerHtml(sm) {
  if (!sm) return '<p class="muted" style="font-size:13px;margin:0">' + t('donnees_indispo') + '</p>';
  const titre = '<p class="sv-sub">' + t('sv_titre') + '</p>';
  const today = sm.today || new Date().toISOString().slice(0, 10);
  const ouverts = sm.ouverts || [];
  const clotures = sm.clotures || [];
  if (!ouverts.length && !clotures.length) return titre + '<p class="muted" style="font-size:13px;margin:0">' + t('sv_aucun') + '</p>';
  const meta = s => [s.collaborateur, SV_TYPE(s.type), s.poseLe ? t('sv_fixe_le', { d: svDateFr(s.poseLe) }) + (s.posePar ? ' ' + t('par_x', { x: s.posePar }) : '') : ''].filter(Boolean).map(escDash).join(' · ');
  const nbRetard = ouverts.filter(s => s.echeance && s.echeance < today).length;
  let html = titre + '<p class="sv-summary">' + tn('sv_en_cours', ouverts.length).replace(/^(\d+)/, '<b>$1</b>')
    + (nbRetard ? ' · <b class="sv-retard">' + t('n_en_retard', { n: nbRetard }) + '</b>' : '') + '</p>';
  html += ouverts.length ? ouverts.map(s => {
    const j = s.echeance ? svJours(today, s.echeance) : null;
    let cls = 'sv-later', txt = '';
    if (j === null) txt = t('sans_date');
    else if (j < 0) { cls = 'sv-retard'; txt = t('retard_de_j', { n: -j }); }
    else if (j === 0) { cls = 'sv-bientot'; txt = t('aujourdhui_min'); }
    else { cls = j <= 7 ? 'sv-bientot' : 'sv-later'; txt = t('dans_j', { n: j }); }
    return '<div class="sv-row"><span><span class="sv-lib">' + escDash(s.libelle) + '</span><span class="sv-meta">' + meta(s) + '</span></span>'
      + '<span class="sv-ech ' + cls + '"><b>' + svDateFr(s.echeance) + '</b>' + txt + '</span></div>';
  }).join('') : '<p class="muted" style="font-size:13px;margin:0">' + t('sv_aucune_en_cours') + '</p>';
  if (clotures.length) {
    html += '<details class="sv-clos"><summary>' + t('sv_clotures', { n: clotures.length }) + '</summary>'
      + clotures.map(s => {
        const fait = s.statut === 'fait';
        return '<div class="sv-row"><span><span class="sv-lib">' + escDash(s.libelle) + '</span><span class="sv-meta">' + meta(s) + '</span></span>'
          + '<span class="sv-ech" style="color:' + (fait ? 'var(--green)' : 'var(--red)') + '"><b>' + (fait ? '✓ ' + t('fait') : '✗ ' + t('pas_fait')) + '</b>'
          + t('le_d', { d: svDateFr(s.clotureLe) }) + (s.cloturePar ? ' · ' + escDash(s.cloturePar) : '') + '<br>' + t('echeance_d', { d: svDateFr(s.echeance) }) + '</span></div>';
      }).join('') + '</details>';
  }
  return html;
}

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(K_SESSION) || 'null');
    if (s && s.token && s.ar && s.exp > Date.now()) { session = s; return s; }
  } catch (e) {}
  session = null;
  return null;
}
function logout() {
  try { localStorage.removeItem(K_SESSION); } catch (e) {}
  session = null;
  stopTodayTimer();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}
async function doLogin() {
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.style.display = 'none';
  const zimbraUser = document.getElementById('login-user').value.trim();
  const zimbraPass = document.getElementById('login-pass').value;
  if (!zimbraUser || !zimbraPass) { errEl.textContent = t('login_requis'); errEl.style.display = 'block'; return; }
  try { localStorage.setItem(K_USER, zimbraUser); } catch (e) {}
  btn.disabled = true; btn.textContent = t('connexion_en_cours');
  try {
    const resp = await fetch(RELAY + '/ar-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ zimbraUser, zimbraPass }) });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || (t('erreur') + ' ' + resp.status));
    session = { token: data.sessionToken, ar: data.ar, exp: Date.now() + data.expiresInMs };
    try { localStorage.setItem(K_SESSION, JSON.stringify(session)); } catch (e) {}
    // Première connexion sans langue choisie : langue de l'utilisateur côté réseau.
    let choisie = null; try { choisie = localStorage.getItem(K_LANG); } catch (e) {}
    const lu = String(data.langue || data.langueUI || '').toLowerCase();
    if (!choisie && LANGS.includes(lu)) { LANG = lu; appliquerLang(); }
    document.getElementById('login-pass').value = '';
    startApp();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = t('login_btn');
  }
}
function authHeaders() { return { 'X-AR-Session': session ? session.token : '' }; }
async function fetchJson(path, opts) {
  const resp = await fetch(RELAY + path, Object.assign({ headers: authHeaders() }, opts || {}));
  const data = await resp.json().catch(() => ({}));
  if (resp.status === 401) { logout(); throw new Error(t('session_expiree')); }
  if (!resp.ok || !data.ok) throw new Error(data.error || (t('erreur') + ' ' + resp.status));
  return data;
}

  visite: r => (r.daysSinceVisit === null || r.daysSinceVisit === undefined) ? Infinity : r.daysSinceVisit,
};
const tableSorts = { network: { key: 'score', dir: 1 }, ar: { key: 'score', dir: 1 }, today: { key: 'libelle', dir: 1 }, mensuel: { key: 'score', dir: -1 } };
const LANCEMENT_RANG = { manquant: 1, attendu: 2, non_attendu: null };
const TODAY_GETTERS = {
  libelle: m => m.libelle || null,
  lancement: m => m.lancement.statut === 'fait' ? (m.lancement.enRetard ? 3 : 4) : (LANCEMENT_RANG[m.lancement.statut] ?? null),
  bilan: m => m.bilan ? 0 : (m.bilanJours ?? null),
  pedlv: m => m.pedlv ? (m.pedlv.fait ? 0 : m.pedlv.joursDepuis) : null,
  kaizen: m => !m.kaizen ? null : (m.kaizen.fait ? 100 + m.kaizen.nbItems : (m.kaizen.scoreMax ? (m.kaizen.score || 0) / m.kaizen.scoreMax * 100 : 0)),
  entretien: m => m.entretien ? m.entretien.nb : 0,
  observation: m => m.observation ? m.observation.nb : 0,
  equipe: m => m.equipe ? 0 : (m.equipeJours ?? null),
  activite: m => nbOutilsFaits(m) * 10 + (m.lancement.statut === 'manquant' ? 0 : m.lancement.enRetard ? 1 : 2),
};
function smValeurDim(m, k) {
  const n = m.neutralisations || {};
  if (n[k] || n['*'] || (m.exclusions && m.exclusions[k])) return null;
  const v = m.sous ? m.sous[k] : null;
  return v === null || v === undefined ? null : v;
}
const SM_GETTERS = {
  libelle: m => m.libelle || null,
  score: m => m.score ?? null,
  evol: m => (m.score != null && m.scorePrecedent != null) ? m.score - m.scorePrecedent : null,
  couv: m => m.couverture ?? null,
};
SUB_KEYS.forEach(k => { SM_GETTERS[k] = m => smValeurDim(m, k); });

function sortRows(rows, sort, getters) {
  const get = (getters || SORT_GETTERS)[sort.key];
  const cmpLib = (a, b) => String(a.libelle || '').localeCompare(String(b.libelle || ''), loc(), { numeric: true });
  return rows.slice().sort((a, b) => {
    const va = get(a), vb = get(b);
    if (va === null && vb === null) return cmpLib(a, b);
    if (va === null) return 1;
    if (vb === null) return -1;
    const cmp = (typeof va === 'string' || typeof vb === 'string')
      ? String(va).localeCompare(String(vb), loc(), { sensitivity: 'base', numeric: true })
      : (va === vb ? 0 : (va < vb ? -1 : 1));
    return cmp * sort.dir || cmpLib(a, b);
  });
}
function thSort(table, key, label, cls, title) {
  const s = tableSorts[table];
  const active = s.key === key;
  return '<th class="sortable' + (cls ? ' ' + cls : '') + (active ? ' sorted' : '') + '" data-table="' + table + '" data-key="' + key + '" onclick="setTableSort(\'' + table + '\', \'' + key + '\')" title="' + escDash(title ? title + ' — ' + t('trier') : t('trier_maj')) + '">'
    + escDash(label) + '<span class="sort-ind">' + (active ? (s.dir === 1 ? '▲' : '▼') : '↕') + '</span></th>';
}
function majIndicateursTri(table) {
  const s = tableSorts[table];
  document.querySelectorAll('th.sortable[data-table="' + table + '"]').forEach(th => {
    const active = th.dataset.key === s.key;
    th.classList.toggle('sorted', active);
    th.querySelector('.sort-ind').textContent = active ? (s.dir === 1 ? '▲' : '▼') : '↕';
  });
}
function setTableSort(table, key) {
  const s = tableSorts[table];
  if (s.key === key) s.dir = -s.dir; else { s.key = key; s.dir = 1; }
  majIndicateursTri(table);
  if (table === 'network') renderTable();
  else if (table === 'ar') renderArStoresRows();
  else if (table === 'today') { syncTodaySortSelect(); renderTodayBody(); }
  else if (table === 'mensuel') renderMonthlyBody();
}

// Filtres pays / animateur communs aux trois onglets.
function optionsFiltres(rows, prefix, prevPays, prevAr) {
  const pays = [...new Set(rows.map(r => r.pays).filter(Boolean))].sort((a, b) => a.localeCompare(b, loc()));
  const ars = [...new Set(rows.map(r => r.animateur).filter(Boolean))].sort((a, b) => a.localeCompare(b, loc()));
  let h = '';
  if (pays.length > 1) h += '<select id="' + prefix + '-pays" onchange="' + prefix + 'FiltreChange()"><option value="">' + t('tous_pays') + '</option>' + pays.map(p => '<option value="' + escDash(p) + '"' + (p === prevPays ? ' selected' : '') + '>' + escDash(p) + '</option>').join('') + '</select>';
  if (ars.length) h += '<select id="' + prefix + '-ar" onchange="' + prefix + 'FiltreChange()"><option value="">' + t('tous_animateurs') + '</option>' + ars.map(a => '<option value="' + escDash(a) + '"' + (a === prevAr ? ' selected' : '') + '>' + escDash(a) + '</option>').join('') + '</select>';
  return h;
}
function lireFiltres(prefix) {
  const p = document.getElementById(prefix + '-pays'), a = document.getElementById(prefix + '-ar'), s = document.getElementById(prefix + '-search');
  return { pays: p ? p.value : '', ar: a ? a.value : '', search: s ? (s.value || '').trim().toLowerCase() : '' };
}
function filtrer(rows, f, avecRecherche) {
  let out = rows;
  if (f.pays) out = out.filter(r => r.pays === f.pays);
  if (f.ar) out = out.filter(r => r.animateur === f.ar);
  if (avecRecherche && f.search) out = out.filter(r => String(r.libelle || '').toLowerCase().includes(f.search) || String(r.code || '').includes(f.search));
  return out;
}
function suffixeFiltre(f) { return [f.pays, f.ar].filter(Boolean).map(x => ' — ' + x).join(''); }

function parisTodayIsoDash() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); }
function addDaysIsoDash(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function todayJoursDisponibles() {
  const today = parisTodayIsoDash();
  const jours = [];
  for (let i = 0; i <= 30; i++) jours.push(addDaysIsoDash(today, -i));
  return jours;
}
function jourLabel(iso, today) {
  if (iso === today) return t('aujourdhui');
  if (iso === addDaysIsoDash(today, -1)) return t('hier');
  const s = new Date(iso + 'T12:00:00Z').toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function stopTodayTimer() { if (todayTimer) { clearInterval(todayTimer); todayTimer = null; } }

  if (!todayData) el.innerHTML = '<div class="loading">' + t('chargement') + '</div>';
  await loadToday();
  stopTodayTimer();
  todayTimer = setInterval(() => {
    if (document.hidden || currentListView !== 'today' || document.getElementById('view-today').style.display === 'none') return;
    if (todayJour !== parisTodayIsoDash()) return;
    loadToday(true);
  }, TODAY_REFRESH_MS);
}

  const info = m => {
    const v = m[cle];
    if (cle === 'entretien') return (v.nb > 1 ? v.nb + ' · ' : '') + escDash((v.types || []).map(SV_TYPE).join(', ')) + (v.heure ? ' · ' + escDash(v.heure) : '');
    if (cle === 'observation') return t('n_obs', { n: v.nb }) + (v.heure ? ' · ' + escDash(v.heure) : '');
    if (cle === 'kaizen') return (v.nbItems ? t('kaizen_items', { n: v.nbItems }) + ' · ' : '') + heurePar(v);
    if (cle === 'equipe') return (v.nb ? t('n_controles_eval', { n: v.nb }) + ' · ' : '') + heurePar(v);
    return heurePar(v);
  };

}

  const nbNeutra = perim.filter(m => Object.keys(m.neutralisations || {}).length).length;
  document.getElementById('sm-kpis').innerHTML = `
    <div class="kpi-card"><p class="lbl">${t('score_moyen')}</p><p class="val">${moy ?? '—'}</p></div>
    <div class="kpi-card"><p class="lbl">${t('magasins_notes')}</p><p class="val">${notes.length}<span class="kpi-sub"> / ${perim.length}</span></p></div>
    <div class="kpi-card"><p class="lbl">${t('avec_neutralisation')}</p><p class="val">${nbNeutra}</p></div>
    <div class="kpi-card"><p class="lbl">${t('propositions_attente')}</p><p class="val" style="color:${(d.propositions || []).length ? 'var(--orange)' : 'inherit'}">${(d.propositions || []).length}</p></div>
  `;
  document.getElementById('sm-body').innerHTML = rows.length ? rows.map(m => {
    const ev = (m.score !== null && m.score !== undefined && m.scorePrecedent !== null && m.scorePrecedent !== undefined) ? m.score - m.scorePrecedent : null;
    const evHtml = ev === null ? '<span class="t-gris">—</span>' : (ev > 0 ? '<span class="sm-up">▲ ' + ev + '</span>' : ev < 0 ? '<span class="sm-down">▼ ' + (-ev) + '</span>' : '<span class="t-gris">=</span>');
    return `<tr class="row-clickable" onclick="smDetail('${escJs(m.code)}')">
      <td><span class="t-mag">${escDash(m.libelle)}</span><span class="t-ar">${escDash([m.pays, m.animateur].filter(Boolean).join(' · '))}</span></td>
      <td class="c"><span class="badge ${scoreClass(m.score ?? null)}" title="${m.score === null || m.score === undefined ? escDash(t('pas_score_couverture')) : ''}">${m.score ?? '—'}</span></td>
      <td class="c">${evHtml}</td>
      ${d.dims.map(k => smCellule(m, k)).join('')}
      <td class="c"><span class="t-gris">${m.couverture != null ? Math.round(m.couverture) + ' %' : '—'}</span></td>
    </tr>`;
  }).join('') : '<tr><td colspan="14" class="muted">' + t('aucun_magasin') + '</td></tr>';
}
function smExplication(dim, e) {
  e = e || {};
  const f = x => x === null || x === undefined ? '—' : x;
  switch (dim) {
    case 'actions': return e.bilan ? t('ex_actions', { d: svDateFr(e.bilan.date), n: e.bilan.actionsReportees, a: e.bilan.actionsAFaire, c: e.bilan.actionsReportees - e.bilan.actionsAFaire }) : t('ex_aucun_bilan');
    case 'positionnement': return e.bilan ? t('ex_positionnement', { d: svDateFr(e.bilan.date), v: f(e.bilan.positionnementAnnuel) }) : t('ex_aucun_bilan');
    case 'equipe': return e.equipe ? t('ex_equipe', { v: e.equipe.niveau, n: e.equipe.nbTaches }) : t('ex_aucune_eval');
    case 'effectif': {
      if (!e.effectif) return '';
      const val = e.effectif.effectif !== undefined ? e.effectif.effectif : e.effectif.effectifDispo;
      const src = e.effectif.source === 'bilan' ? t('ex_eff_bilan', { d: svDateFr(e.effectif.bilanDate) }) : t('ex_eff_rh', { m: e.effectif.rhMois ? ' ' + smMoisLabel(e.effectif.rhMois) : '' });
      return (e.effectif.indicatif ? '[' + t('indicatif') + '] ' : '') + t('ex_effectif', { s: src, v: val, th: f(e.effTheo), e: e.effectif.delta }) + (e.effectif.sousEffectifSoutenu ? ' · ' + t('ex_sous_eff', { e: e.effectif.ecartMoyen3Mois }) : '') + '.';
    }
    case 'absenteisme': return e.absenteisme ? (e.absenteisme.indicatif ? '[' + t('indicatif') + '] ' + t('ex_abs_dernier', { m: smMoisLabel(e.absenteisme.rhMois) }) : t('ex_abs_mois')) + SEP() + e.absenteisme.tauxPct + ' %.' : '';
    case 'pedlv': return e.pedlv ? t('ex_pedlv', { d: smDateFr(e.pedlv.envoyeLe), p: e.pedlv.periode, r: e.pedlv.rouges, n: e.pedlv.total }) : t('ex_aucun_pedlv');
    case 'avis': return e.avis && e.avis.rating ? t('ex_avis', { r: e.avis.rating, n: f(e.avis.reviews), d: smDateFr(e.avis.majLe) }) : '';
    case 'kaizen': return e.kaizen ? t('ex_kaizen', { s: e.kaizen.score, m: e.kaizen.scoreMax }) + ' (' + (e.kaizen.cloture ? t('cloture') : t('non_cloture')) + ').' : t('ex_aucun_kaizen');
    case 'entretiens': return e.entretiens ? t('ex_entretiens', { v: e.entretiens.vus, e: e.entretiens.eligibles, m: e.entretiens.rhMois }) : '';
    case 'lancements': return e.lancements ? t('ex_lancements', { l: e.lancements.joursLances, o: e.lancements.joursOuverts }) : '';
  }
  return '';
}
function smDetail(code) {
  smDetailCode = code;
  const d = smData;
  const admin = d.estAdmin || d.estOlivier;
  const m = d.magasins.find(x => x.code === code);
  if (!m) return;
  const neutra = m.neutralisations || {};
  const lignes = d.dims.map(k => {
    const n = neutra[k];
    const excl = m.exclusions && m.exclusions[k];
    const v = m.sous ? m.sous[k] : null;
    const etat = n ? '<span class="sm-n">' + t('neutralise') + '</span> <span class="sv-meta">' + escDash(n.motif || '') + ' — ' + escDash(auteurLabel(n.par)) + (admin && !d.apercu ? ' · <a href="#" onclick="smRetirer(' + n.id + ');return false">' + t('retirer') + '</a>' : '') + '</span>'
      : excl ? '<span class="t-gris">' + t('exclu') + '</span> <span class="sv-meta">' + escDash(excl) + '</span>'
      : '<span class="sv-meta">' + escDash(smExplication(k, m.entrees)) + '</span>';
    const coche = (!n && !d.apercu) ? '<input type="checkbox" class="sm-dim-cb" value="' + k + '">' : '<span style="display:inline-block;width:13px"></span>';
    return '<div class="sm-dim-row"><label>' + coche + ' <b>' + escDash(SUB_LABEL(k)) + '</b> <span class="t-gris">' + t('poids_x', { x: d.poids[k] }) + '</span></label><span class="sm-dim-v">' + (n || excl || v === null || v === undefined ? '—' : Math.round(v)) + '</span><div class="sm-dim-etat">' + etat + '</div></div>';
  }).join('');
  const entier = neutra['*'];
  const form = d.apercu ? '<p class="sv-meta" style="margin-top:12px">' + t('sm_neutra_apres_calcul') + '</p>' : `
    <div class="sm-neutra-form">
      <label class="sm-entier"><input type="checkbox" id="sm-entier"> ${t('sm_neutra_entier')}</label>
      <input type="text" id="sm-motif" placeholder="${escDash(t('motif_obligatoire'))}">
      <button class="sm-btn sm-btn-red" onclick="smNeutraliser()">${admin ? t('sm_neutraliser') : t('sm_proposer')}</button>
      ${admin ? '' : '<p class="sv-meta">' + t('sm_proposition_effet') + '</p>'}
    </div>`;
  document.getElementById('sm-modal-content').innerHTML = `
    <h3>${escDash(m.libelle)}</h3>
    <p class="sv-meta" style="margin:0 0 10px">${escDash([m.pays, m.animateur].filter(Boolean).join(' · '))} · ${escDash(smMoisLabel(d.mois))} · ${t('col_score')} <b>${m.score ?? '—'}</b> · ${t('couverture')} ${m.couverture != null ? Math.round(m.couverture) + ' %' : '—'}${entier ? ' · <span class="sm-n">' + t('magasin_neutralise') + '</span> (' + escDash(entier.motif || '') + (admin ? ', <a href="#" onclick="smRetirer(' + entier.id + ');return false">' + t('retirer') + '</a>' : '') + ')' : ''}</p>
    <div style="margin-bottom:8px">${appLink('suivi-managers', m.code, t('app_suivi'))}</div>
    ${lignes}
    ${form}`;
  document.getElementById('sm-modal').style.display = 'flex';
}
function smFermer() { document.getElementById('sm-modal').style.display = 'none'; smDetailCode = null; }
async function smNeutraliser() {
  const motif = (document.getElementById('sm-motif').value || '').trim();
  const dims = [...document.querySelectorAll('.sm-dim-cb:checked')].map(c => c.value);
  if (document.getElementById('sm-entier').checked) dims.push('*');
  if (!dims.length) { alert(t('sm_coche_dim')); return; }
  if (!motif) { alert(t('motif_obligatoire')); return; }
  const r = await smPost({ action: 'neutraliser', magasins: [smDetailCode], dimensions: dims, motif });
  if (!r) return;
  const code = smDetailCode;
  await loadMonthly();
  if (r.statut === 'proposee') { alert(t('sm_proposition_envoyee')); smFermer(); } else smDetail(code);
}
async function smRetirer(id) {
  if (!confirm(t('sm_confirm_retirer'))) return;
  const code = smDetailCode;
  if (await smPost({ action: 'retirer', id })) { await loadMonthly(); if (code) smDetail(code); }
}
async function smDecider(id, accepter) {
  const ids = id ? [id] : (smData.propositions || []).map(p => p.id);
  if (!id && !confirm(t(accepter ? 'sm_confirm_accepter_tout' : 'sm_confirm_refuser_tout', { n: ids.length }))) return;
  if (await smPost({ action: 'decider', ids, accepter })) loadMonthly();
}
async function smCalculer() {
  const d = smData;
  if (!confirm(d.apercu ? t('sm_confirm_calcul', { m: smMoisLabel(d.mois) }) : t('sm_confirm_recalcul', { m: smMoisLabel(d.mois) }))) return;
  if (await smPost({ action: 'calculer' })) loadMonthly();
}
async function smSupprimer() {
  if (!confirm(t('sm_confirm_supprimer', { m: smMoisLabel(smData.mois) }))) return;
  if (await smPost({ action: 'supprimer' })) loadMonthly();
}
async function smValider() {
  if (!confirm(t('sm_confirm_valider', { m: smMoisLabel(smData.mois) }))) return;
  if (await smPost({ action: 'valider' })) loadMonthly();
}
function smArAbsentModal() {
  const ars = [...new Set(smData.magasins.map(m => m.animateur).filter(Boolean))].sort((a, b) => a.localeCompare(b, loc()));
  document.getElementById('sm-modal-content').innerHTML = `
    <h3>${t('sm_ar_absent_titre')} — ${escDash(smMoisLabel(smData.mois))}</h3>
    <p class="sv-meta" style="margin:0 0 12px">${t('sm_ar_absent_txt', { d: smData.dimsArAbsent.map(k => escDash(SUB_LABEL(k))).join(', ') })}</p>
    ${ars.length ? `<div class="sm-neutra-form">
      <select id="sm-ar-absent">${ars.map(a => '<option value="' + escDash(a) + '">' + escDash(a) + '</option>').join('')}</select>
      <input type="text" id="sm-motif-ar" placeholder="${escDash(t('motif_obligatoire'))}">
      <button class="sm-btn sm-btn-red" onclick="smArAbsent()">${t('sm_neutraliser')}</button>
    </div>` : '<p class="muted" style="font-size:13px">' + t('aucun_animateur') + '</p>'}`;
  document.getElementById('sm-modal').style.display = 'flex';
}
async function smArAbsent() {
  const ar = document.getElementById('sm-ar-absent').value;
  const motif = (document.getElementById('sm-motif-ar').value || '').trim();
  if (!motif) { alert(t('motif_obligatoire')); return; }
  if (await smPost({ action: 'neutraliser', arAbsent: ar, motif })) { smFermer(); loadMonthly(); }
}
function smChargerXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => ko(new Error(t('xlsx_ko')));
    document.head.appendChild(s);
  });
}
async function smExporter() {
  try { await smChargerXlsx(); } catch (e) { alert(e.message); return; }
  const d = await loadMonthly(true);
  if (!d) return;
  const statut = d.apercu ? t('x_statut_apercu') : d.statut === 'valide' ? t('x_statut_valide') : t('x_statut_provisoire');
  const mags = d.magasins.slice();
  const notes = mags.filter(m => m.score !== null && m.score !== undefined).sort((a, b) => b.score - a.score);
  const rangReseau = {}; notes.forEach((m, i) => { rangReseau[m.code] = i + 1; });
  const rangPays = {}; const parPays = {};
  notes.forEach(m => { (parPays[m.pays || ''] ??= []).push(m); });
  Object.values(parPays).forEach(arr => arr.forEach((m, i) => { rangPays[m.code] = i + 1; }));
  const etatDim = (m, k) => { const n = (m.neutralisations || {})[k] || (m.neutralisations || {})['*']; if (n) return t('neutralise') + SEP() + (n.motif || ''); if (m.exclusions && m.exclusions[k]) return t('exclu') + SEP() + m.exclusions[k]; return t('compte'); };
  const C = k => t('x_' + k);
  const synthese = mags.sort((a, b) => String(a.libelle).localeCompare(String(b.libelle), loc())).map(m => ({
    [C('mois')]: d.mois, [C('statut')]: statut, [C('version')]: d.version ?? '', [C('code')]: m.code, [C('magasin')]: m.libelle, [C('pays')]: m.pays || '', [C('animateur')]: m.animateur || '',
    [C('score')]: m.score ?? t('pas_de_score'), [C('score_prec')]: m.scorePrecedent ?? '',
    [C('evolution')]: (m.score != null && m.scorePrecedent != null) ? m.score - m.scorePrecedent : '',
    [C('couverture')]: m.couverture ?? '', [C('rang_reseau')]: rangReseau[m.code] ?? '', [C('rang_pays')]: rangPays[m.code] ?? '',
  }));
  const detail = mags.map(m => {
    const row = { [C('mois')]: d.mois, [C('statut')]: statut, [C('code')]: m.code, [C('magasin')]: m.libelle, [C('pays')]: m.pays || '', [C('animateur')]: m.animateur || '', [C('score')]: m.score ?? t('pas_de_score') };
    d.dims.forEach(k => {
      const v = m.sous ? m.sous[k] : null;
      row[SUB_LABEL(k) + ' — ' + C('sous_score')] = (v === null || v === undefined) ? '' : Math.round(v * 10) / 10;
      row[SUB_LABEL(k) + ' — ' + C('poids')] = d.poids[k];
      row[SUB_LABEL(k) + ' — ' + C('etat')] = etatDim(m, k);
      row[SUB_LABEL(k) + ' — ' + C('justification')] = smExplication(k, m.entrees);
    });
    return row;
  });
  const neutra = (d.neutralisationsHistorique || []).map(n => ({
    [C('code')]: n.magasin_code, [C('magasin')]: (mags.find(m => m.code === n.magasin_code) || {}).libelle || '', [C('dimension')]: n.dimension === '*' ? t('magasin_entier') : SUB_LABEL(n.dimension),
    [C('statut')]: n.statut, [C('origine')]: n.origine, [C('motif')]: n.motif || '', [C('propose_par')]: n.propose_par || '', [C('propose_le')]: n.propose_le || '', [C('decide_par')]: n.decide_par || '', [C('decide_le')]: n.decide_le || '',
  }));
  const journal = (d.journal || []).map(j => ({ [C('date')]: j.le, [C('action')]: j.action, [C('auteur')]: j.auteur || '', [C('magasin')]: j.magasin_code || '', [C('motif')]: j.motif || '', [C('detail')]: j.detail || '' }));
  const P = (k, v) => ({ [C('parametre')]: k, [C('valeur')]: v });
  const params = [
    P(C('mois'), d.mois), P(C('statut'), statut), P(C('version'), d.version ?? ''),
    P(C('calcule_le'), d.calculeLe || ''), P(C('valide_le'), d.valideLe || ''), P(C('valide_par'), d.validePar || ''),
    P(C('revise_le'), d.reviseLe || ''), P(C('date_limite'), d.dateLimite),
    P(C('regles'), d.reglesVersion), P(C('seuil'), t('x_seuil_val')),
    ...d.dims.map(k => P(C('poids') + ' — ' + SUB_LABEL(k), d.poids[k])),
  ];
  const wb = XLSX.utils.book_new();
  const ajouter = (rows, nom, videTxt) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': videTxt }]), nom.slice(0, 31));
  ajouter(synthese, C('f_synthese'), t('aucun_magasin'));
  ajouter(detail, C('f_detail'), t('aucun_magasin'));
  ajouter(neutra, C('f_neutralisations'), t('x_aucune_neutra'));
  ajouter(journal, C('f_journal'), t('x_aucune_action'));
  ajouter(params, C('f_parametres'), '');
  XLSX.writeFile(wb, 'score-sante-mensuel-inter-' + d.mois + (d.version ? '-v' + d.version : '-apercu') + (d.statut === 'valide' ? '-valide' : '') + '.xlsx');
}

// ---------------------------------------------------------------- Démarrage
(function boot() {
  initLang();
  try { document.getElementById('login-user').value = localStorage.getItem(K_USER) || ''; } catch (e) {}
  if (loadSession()) startApp();
  else document.getElementById('login-screen').style.display = 'flex';
})();
</script>
